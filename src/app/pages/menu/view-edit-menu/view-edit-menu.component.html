@if (!authService.isLoggedIn) {
  <p class="py-16 text-center text-[14px] text-ink/65">{{ "menu.loginNeeded" | translate }}</p>
} @else if (loading()) {
  <div class="flex justify-center py-16">
    <span class="loading loading-spinner loading-lg text-accent"></span>
  </div>
} @else {
  @if (menu(); as m) {
    <app-menu-viewer-editor
      [startInViewMode]="true"
      [menuId]="m.id!"
      [initialMenuName]="m.name ?? ''"
      [initialMenuDays]="m.recipes ?? []" />
  }
}
