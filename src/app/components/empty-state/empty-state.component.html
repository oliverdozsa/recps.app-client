<div class="flex flex-col items-center gap-4 py-20 text-center">
  <p class="text-[17px] font-semibold text-ink">{{ "emptyState.title" | translate }}</p>

  @if (excludeChips().length > 0) {
    <div class="flex flex-wrap justify-center gap-2">
      @for (chip of excludeChips(); track chip.key) {
        <span class="inline-flex items-center gap-1.5 rounded-full border border-danger-line bg-danger-tint px-2.75 py-1.5 text-[13px] font-medium text-danger">
          <span class="line-through">{{ chip.label }}</span>
          <button
            type="button"
            class="opacity-70 transition-opacity hover:opacity-100"
            [attr.aria-label]="('emptyState.removeExclusion' | translate) + ': ' + chip.label"
            (click)="removeExclude.emit(chip)">
            ×
          </button>
        </span>
      }
    </div>
  }

  <button
    type="button"
    class="rounded-lg bg-ink px-4 py-2 text-[13px] font-medium text-canvas transition-colors hover:bg-ink/85"
    (click)="clearFilters.emit()">
    {{ "emptyState.clearFilters" | translate }}
  </button>
</div>
