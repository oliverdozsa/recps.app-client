@if (authService.isLoggedIn()) {
  <div class="relative inline-flex" appClickOutside (appClickOutside)="close()">
    <button type="button" class="flex h-11 items-center rounded-full" aria-haspopup="menu" [attr.aria-expanded]="open()" [attr.aria-label]="'login.userMenuAriaLabel' | translate" (click)="toggle()">
      <img [src]="picture" alt="" class="size-9 rounded-full border border-ink/12">
    </button>
    @if (open()) {
      <ul class="absolute right-0 top-[calc(100%+6px)] z-30 min-w-56 rounded-[11px] border border-ink/10 bg-surface p-1.5 shadow-lg" role="menu">
        <li class="flex items-center gap-2 px-2.5 py-2">
          <img [src]="picture" alt="" class="size-8 rounded-full">
          <span class="text-[13px] font-semibold text-ink">{{ name }}</span>
        </li>
        <li>
          <button type="button" class="w-full rounded-lg px-2.5 py-2 text-left text-[13px] font-medium text-danger transition-colors hover:bg-danger-tint" (click)="authService.logout(); close()">
            {{ "login.signOut" | translate }}
          </button>
        </li>
      </ul>
    }
  </div>
} @else {
  <button
    type="button"
    class="rounded-lg bg-ink px-3 py-1.5 text-[13px] font-medium text-canvas transition-colors hover:bg-ink/85"
    (click)="authService.login()">
    {{ "login.signIn" | translate }}
  </button>
}
