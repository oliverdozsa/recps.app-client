<div class="relative h-7 w-full">
  <div class="absolute top-1/2 h-2 w-full -translate-y-1/2 rounded-full" [style]="trackFillStyle()"></div>
  <input
    #lowerInput
    type="range"
    class="range-thumb pointer-events-none absolute left-0 top-0 m-0 h-full w-full appearance-none bg-transparent"
    [min]="min()" [max]="max()" [step]="step()" [value]="lowerThumb()"
    (input)="onLowerChange($any($event.target).value)"
    [attr.aria-label]="'dualRange.minValue' | translate">
  <input
    #upperInput
    type="range"
    class="range-thumb pointer-events-none absolute left-0 top-0 m-0 h-full w-full appearance-none bg-transparent"
    [min]="min()" [max]="max()" [step]="step()" [value]="upperThumb()"
    (input)="onUpperChange($any($event.target).value)"
    [attr.aria-label]="'dualRange.maxValue' | translate">
</div>
<div class="mt-1 flex justify-between font-mono text-[11px] text-ink/60">
  <span>{{ lowerThumb() }}</span>
  <span>{{ upperThumb() === max() ? upperThumb() + '+' : upperThumb() }}</span>
</div>
